            const titleEl = document.createElement('h3');
            titleEl.className = 'app-title';
            if (window.vnRenderTitle) {
                window.vnRenderTitle(titleEl, app.title, { className: 'vn-title-img' });
            } else {
                titleEl.textContent = (window.vnCloakText || function(x){return x;})(app.title);
            }
            info.appendChild(titleEl);
            card.appendChild(img);
            card.appendChild(info);

            card.addEventListener('click', () => {
                if (app.link.startsWith('/') && !app.link.includes(__ccfg.prefix)) {
                    window.location.href = app.link;
                } else {
                    const encodedTitle = btoa(app.title);
                    window.location.href = `/view.html?app=${encodeURIComponent(app.link)}&title=${encodedTitle}`;
                }
            });

            return card;
        }

        function renderApps(apps) {
            const appsGrid = document.getElementById('appsGrid');
            const noResults = document.getElementById('noResults');
            const appsSection = document.getElementById('appsSection');

            appsGrid.innerHTML = '';

            if (apps.length === 0) {
                appsSection.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            appsSection.style.display = 'block';

            apps.forEach((app, index) => {
                const appCard = createAppCard(app);
                appsGrid.appendChild(appCard);

                setTimeout(() => {
                    appCard.style.transition = 'all 0.4s ease';
                    appCard.style.opacity = '1';
                    appCard.style.transform = 'translateY(0)';
                }, index * 50);
            });
        }

        function filterApps(searchTerm) {
            if (!searchTerm.trim()) {
                filteredApps = [...allApps];
            } else {
                filteredApps = allApps.filter(app =>
                    app.title.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }
            renderApps(filteredApps);
        }

        function initializeApps() {
            allApps = [...appsData];
            filteredApps = [...allApps];

            document.getElementById('loadingMessage').style.display = 'none';

            const urlParams = new URLSearchParams(window.location.search);
            const searchParam = urlParams.get('search');

            if (searchParam) {
                document.getElementById('searchInput').value = decodeURIComponent(searchParam);
                filterApps(decodeURIComponent(searchParam));
            } else {
                renderApps(filteredApps);
            }
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;

            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    filterApps(e.target.value);
                }, 300);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeApps();
            setupSearch();
        });
</script>
